<!--
1️⃣ Ideja

Ti želiš besplatno rješenje na GitHub Pages → statička stranica, nema servera.

Gosti ne bi unosili email/lozinku, nego kliknu poseban link koji vrijedi određeno vrijeme.

Link sadrži token, npr. TOKEN123.

Kada korisnik otvori link, JavaScript u pregledniku provjerava:

- Je li token važeći
- Je li link još unutar vremena trajanja

Ako je sve ok → preusmjerava na glavnu stranicu (home.html).

Ako je link istekao ili nevažeći → preusmjerava na expired.html.
